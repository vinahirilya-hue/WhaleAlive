<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲸鱼工坊 · 序列帧查看器</title>
<style>
:root{color-scheme:light;--ink:#243b50;--muted:#6c8293;--line:#dce6ee;--accent:#246f8c}*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:var(--ink);font:14px/1.5 'Segoe UI','Microsoft YaHei',sans-serif}button,input,select{font:inherit}button,select,.file-button{border:1px solid #cfdee7;border-radius:10px;background:#fff;color:var(--ink);padding:9px 13px;cursor:pointer}button:hover,.file-button:hover{background:#edf7fa;border-color:#8db6c9}button:disabled{opacity:.4;cursor:not-allowed}button.primary,.file-button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,.file-button:focus-within{outline:3px solid #61bbd7;outline-offset:3px}input[type=number]{width:70px;border:1px solid var(--line);padding:7px;border-radius:8px;color:var(--ink)}input[type=range],input[type=checkbox]{accent-color:var(--accent)}input[type=checkbox]{width:17px;height:17px}header{max-width:1500px;margin:auto;padding:28px 32px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:25px;margin:4px 0}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--accent);font-weight:700}.sub{color:var(--muted);margin:5px 0 0}.toolbar,.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.file-button input{position:absolute;width:1px;height:1px;opacity:0}main{max-width:1500px;margin:0 auto;padding:0 32px 28px;display:grid;grid-template-columns:minmax(340px,.9fr) minmax(430px,1.1fr);gap:20px}.panel{border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 8px 28px #27465a06;overflow:hidden}.preview{align-self:start;position:sticky;top:18px}.panel-heading{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.panel-heading strong{font-size:15px}.tag{font-size:12px;color:var(--accent);padding:4px 10px;border-radius:20px;background:#e9f5f8}.stage{height:440px;margin:16px;position:relative;display:flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden;background:#f8fafc}.checker{background-color:#fff;background-image:conic-gradient(#e9eef2 25%,transparent 0 50%,#e9eef2 0 75%,transparent 0);background-size:24px 24px}.stage.dark{background:#192b3b}.stage.light{background:#fff}.stage img{object-fit:contain;max-width:100%;max-height:100%;width:100%;height:100%}.stage img[hidden]{display:none}.empty{text-align:center;color:var(--muted);padding:28px}.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:10px}.stage.dark .empty b,.stage.dark .empty{color:#d7e7f0}.readout{padding:0 20px 16px;display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}#frameName{overflow-wrap:anywhere}.controls{border-top:1px solid var(--line);padding:17px 20px}.controls .row+.row{margin-top:14px}.controls label{display:flex;align-items:center;gap:7px}#scrub{width:100%;margin:0 0 12px}.settings{justify-content:space-between}.hint{font-size:12px;color:var(--muted);margin:14px 0 0;line-height:1.9}kbd{font:11px monospace;border:1px solid var(--line);border-radius:4px;padding:1px 4px;background:#f7fafc}.actions{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;gap:12px}.actions button{font-size:12px;padding:7px 10px}.grid{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:12px;max-height:610px;overflow:auto;min-height:200px}.frame{border:2px solid transparent;border-radius:12px;background:#f3f6f9;overflow:hidden;position:relative}.frame.current{border-color:var(--accent);box-shadow:0 0 0 2px #246f8c22}.frame.excluded{background:#f1f1f1}.frame.excluded .thumb img{opacity:.28}.frame.excluded .name{text-decoration:line-through;color:#8a9299}.thumb{padding:0;border:0;border-radius:0;display:block;width:100%;height:110px;background-color:#fff}.thumb img{width:100%;height:100%;object-fit:contain}.frame .name{font-size:11px;padding:6px 8px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frame label{font-size:12px;display:flex;align-items:center;gap:5px;padding:5px;cursor:pointer}.frame .number{position:absolute;top:5px;left:5px;border-radius:4px;padding:1px 5px;font-size:10px;background:#ffffffdd;color:#52687c;pointer-events:none}.grid>.empty{grid-column:1/-1;align-self:center}.footer-actions{padding:14px 18px;border-top:1px solid var(--line)}#message{max-width:1436px;margin:0 auto 14px;padding:10px 16px;border:1px solid #c9e0eb;background:#e5f3f8;border-radius:10px;color:#315d74}#message:empty{display:none}body.dragging:after{content:'松开以导入 PNG 序列';position:fixed;inset:16px;border:3px dashed #43a4bc;background:#e8f8fff0;border-radius:24px;display:grid;place-items:center;font-size:28px;color:var(--accent);pointer-events:none;z-index:10}@media(max-width:900px){header{padding:20px;align-items:flex-start;flex-direction:column}main{grid-template-columns:1fr;padding:0 16px 20px}.preview{position:static}.stage{height:360px}.grid{max-height:480px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head>
<body>
<header><div><div class="eyebrow">WHALE STUDIO / FRAME PLAYER</div><h1>把喜欢的帧，留下来。</h1><p class="sub">导入序列 → 排除多余帧 → 循环试看。文件仅在本机处理。</p></div><div class="toolbar"><label class="file-button primary">导入 PNG 序列<input id="files" type="file" accept=".png,image/png" multiple></label><label class="file-button">导入文件夹<input id="folder" type="file" accept=".png,image/png" webkitdirectory multiple></label></div></header>
<div id="message" role="status" aria-live="polite"></div>
<main>
<section class="panel preview"><div class="panel-heading"><strong>动作预览</strong><span id="playState" class="tag">等待导入</span></div><div id="stage" class="stage checker"><img id="picture" hidden alt="当前序列帧"><div id="empty" class="empty"><b>让一组图片动起来</b>拖入多个 PNG，或从上方导入。<br>右侧取消勾选，即可跳过不想要的帧。</div></div><div class="readout"><span id="frameName">尚未导入</span><span id="dimensions"></span></div><div class="controls"><input id="scrub" type="range" min="0" max="0" value="0" disabled aria-label="逐帧定位"><div class="row"><button id="prev" disabled title="上一保留帧">← 上一帧</button><button id="play" class="primary" disabled>播放</button><button id="next" disabled title="下一保留帧">下一帧 →</button><button id="toggle" disabled>排除此帧</button></div><div class="row settings"><label>帧率 <input id="fps" type="number" min="1" max="60" step="1" value="12"> FPS</label><label><input id="loop" type="checkbox" checked>循环播放</label></div><div class="row settings"><label>背景 <select id="background"><option value="checker">透明棋盘</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label>显示 <select id="size"><option value="fit">适应画布</option><option value="160">160 px</option><option value="256">256 px</option><option value="512">512 px</option></select></label></div><p class="hint"><kbd>空格</kbd> 播放 / 暂停　<kbd>←</kbd> <kbd>→</kbd> 逐帧　<kbd>X</kbd> 排除 / 恢复<br>点击缩略图或拖动进度条可检查任意帧，包括已排除帧。</p></div></section>
<section class="panel"><div class="panel-heading"><strong>序列帧</strong><span id="counts" class="tag">0 帧</span></div><div class="actions"><div class="row"><button id="all" disabled>全部保留</button><button id="none" disabled>全部排除</button><button id="invert" disabled>反选</button><button id="undo" disabled>撤销筛选</button><span id="duration" class="sub"></span></div><div class="row"><span>区间</span><input id="rangeStart" type="number" min="1" value="1" aria-label="区间开始序号"><span>—</span><input id="rangeEnd" type="number" min="1" value="1" aria-label="区间结束序号"><button id="excludeRange" disabled>排除区间</button><button id="keepRange" disabled>恢复区间</button></div></div><div id="grid" class="grid"><div class="empty">文件会按名称中的数字自然排序。<br>例如 1、2、3 … 10。</div></div><div class="footer-actions"><div class="row"><button id="export" class="primary" disabled>导出保留帧 ZIP</button><button id="save" disabled>保存筛选方案</button><label class="file-button">载入筛选方案<input id="load" type="file" accept=".json,application/json"></label></div><p class="hint">排除操作不会删除原图。ZIP 含重新编号的 PNG 和播放清单。<br>再次打开时，先导入同一组 PNG，再载入保存的筛选方案。</p></div></section>
</main><script src="core.js"></script><script src="viewer.js"></script>
</body></html>
